name: README build

on:
  push:
    branches:
      - main
    # The job pushes dark_mode.svg + cache/ itself. Ignoring them here (together with
    # pushing via GITHUB_TOKEN, which never re-triggers workflows) prevents a run loop.
    paths-ignore:
      - 'dark_mode.svg'
      - 'cache/**'
      - 'README.md'
  schedule:
    # 04:00 UTC daily. Note: GitHub disables scheduled workflows after 60 days
    # without repository activity - re-enable it from the Actions tab if that happens.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update SVG
        env:
          # Fine-grained or classic PAT with read access to your repositories.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          # Public information - deliberately not a secret, so it stays readable in logs.
          USER_NAME: m3hdi2gh
        run: python today.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "Update profile stats"
          git push
